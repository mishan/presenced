[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "presenced"
dynamic = ["version"]
description = "Presence detection daemon for Linux laptops, using the built-in speaker, microphones and IR camera"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Misha Nasledov", email = "misha@nasledov.com" }]
requires-python = ">=3.12"
dependencies = ["numpy", "opencv-python-headless", "dbus-fast"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: No Input/Output (Daemon)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/mishan/presenced"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
presenced = "presenced.service:main"
presencectl = "presenced.ctl:main"

[tool.setuptools]
packages = ["presenced"]

[tool.setuptools.dynamic]
version = { attr = "presenced.__version__" }
